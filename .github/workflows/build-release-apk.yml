name: Build release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD repo secrets first (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease --no-daemon

      - name: Rename outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/DIPTI-Medical-release.apk
          cp app/build/outputs/bundle/release/app-release.aab out/DIPTI-Medical-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: DIPTI-Medical-release
          path: out/
